<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Blind</title>
    <style>
      /* The page always fills the window exactly, so it never scrolls, even if something inside reaches past an edge. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* The Theme's terminal background, as transparent as the background.transparency setting says, over the window's
         blur. The colours are the Theme's, set by the script. */
      body {
        display: flex;
        flex-direction: column;
        background: var(--window-background);
      }
      /* The corners macOS rounds the window to, which match a Finder window's. */
      :root {
        --window-corner-radius: 16px;
      }
      /* The Bezel: a thin border around a Session's window, drawn over its edge so it takes no room from the Panes. Its
         corners follow the window's. */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 2;
        border-radius: var(--window-corner-radius);
        box-shadow: inset 0 0 0 1px var(--strong-divider);
        pointer-events: none;
      }
      #panes {
        position: relative;
        flex: 1;
      }
      /* Isolated, so the layers xterm.js stacks inside a terminal stay under the Session Banner. A terminal's box can
         reach past the Pane's edge, by the scroll bar's room, which the Pane clips. */
      .pane {
        position: absolute;
        box-sizing: border-box;
        isolation: isolate;
        overflow: hidden;
      }
      /* With the pane.padding setting padded, the text keeps off the Pane's edges and the dividers next to it. */
      :root {
        --pane-padding-x: 7px;
        --pane-padding-y: 5px;
      }
      body.padded-panes .pane {
        padding: var(--pane-padding-y) var(--pane-padding-x);
      }
      /* Stronger than the Tab bar's borders, in the colour the script mixes for them. */
      .pane.divided-left {
        border-left: 1.5px solid var(--strong-divider);
      }
      .pane.divided-top {
        border-top: 1.5px solid var(--strong-divider);
      }
      .pane.hidden {
        visibility: hidden;
      }
      .pane .terminal {
        height: 100%;
      }
      /* Once the scroll bar's width, `--scroll-bar-width`, is set, xterm.js draws search matches in a column beside it;
         blind shows none. */
      .xterm .xterm-decoration-overview-ruler {
        display: none;
      }
      /* The scroll bar's thumb is rounded, on a clear track. */
      .xterm .xterm-scrollable-element > .scrollbar > .slider {
        border-radius: 4px;
      }
      /* xterm.js keeps room for the bar beside the text only while there is scrollback, and marks the bar `fade` when
         it is needed but has faded out after the mouse left or the scrolling stopped. With the pane.scrollBar setting
         visible, that bar stays shown; one with nothing to scroll stays hidden. */
      body:not(.scroll-bar-hidden) .xterm .xterm-scrollable-element > .scrollbar.vertical.fade {
        opacity: 1;
        pointer-events: auto;
      }
      /* With none, the bar is hidden, and the terminal's box reaches past the Pane's edge by the bar's room, which the
         Pane clips, so the columns fill the Pane. */
      body.scroll-bar-hidden .xterm .xterm-scrollable-element > .scrollbar.vertical {
        display: none;
      }
      body.has-scrollback.scroll-bar-hidden .pane .terminal {
        margin-right: calc(-1 * var(--scroll-bar-width));
      }
      /* xterm's stylesheet paints the viewport opaque black, which would cover the body's background. */
      .pane .xterm .xterm-viewport {
        background-color: transparent;
      }
      /* Centred over the Panes, under the Command Palette and the find bar, which come later in the page. It shows at
         once and, once `fading`, fades out over 250ms. */
      #session-banner {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        transform: translate(-50%, -50%);
        max-width: 80%;
        padding: 8px 18px;
        border-radius: 999px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        font: 600 15px system-ui, sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--session-banner-text);
        background: var(--session-banner-background);
        pointer-events: none;
      }
      #session-banner[hidden] {
        display: none;
      }
      #session-banner.fading {
        opacity: 0;
        transition: opacity 250ms linear;
      }
      /* The Session's label on a row of its own, below the Tabs. */
      #tab-bar {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--divider);
        font: 12px system-ui, sans-serif;
        color: var(--tab-text);
      }
      #tab-bar[hidden] {
        display: none;
      }
      #tabs {
        display: flex;
      }
      .tab,
      #session-label {
        padding: 3px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
      }
      .tab {
        flex: 1;
        min-width: 0;
      }
      /* A Tab divider between every two Tabs, as tall as their pills and in the colour of the Pane dividers, drawn in
         the Tab's padding so the Tabs keep equal widths. The 6px is the Tab's top and bottom padding. */
      .tab + .tab {
        background: linear-gradient(var(--strong-divider), var(--strong-divider)) left center / 1px calc(100% - 6px)
          no-repeat;
      }
      #session-label {
        padding: 3px 6px;
        border-top: 1px solid var(--divider);
      }
      /* Every pill has a border, clear where unused, so all of them keep the same height. */
      .pill {
        display: inline-block;
        box-sizing: border-box;
        max-width: 100%;
        padding: 1px 8px;
        border: 1px solid transparent;
        border-radius: 999px;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
      }
      .tab .pill {
        border-color: var(--divider);
      }
      .tab.focused .pill {
        border-color: transparent;
        color: var(--accent-text);
        background: var(--accent);
        font-weight: 600;
      }
      #session-label .pill {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* After the shown Tabs, as wide as its pill: how many Hidden Tabs have Activity, in italic as Hidden Tabs are in the
         Command Palette and the Activity Sidebar. */
      .tab.hidden-tabs-activity {
        flex: none;
        padding: 3px 6px;
        font-style: italic;
      }
      /* The dot marking a Tab, a Session or a Command Palette result with Activity, in the Theme's activity colour. */
      .activity-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 5px;
        border-radius: 50%;
        background: var(--activity);
        vertical-align: middle;
      }
      /* After the Session's label, the other Sessions with Activity, each in a pill of its own. */
      .activity-chip {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 7px;
        border: 1px solid var(--divider);
        border-radius: 999px;
        vertical-align: middle;
      }
      /* Each result sits `--result-inset` in from the Command Palette's sides, with its text `--result-padding-x` in
         from its own. */
      :root {
        --result-inset: 10px;
        --result-padding-x: 14px;
      }
      /* Its corners match the window's. The script sets how far down it sits, and its edge, around the input and the
         results, drags it up or down. */
      #palette {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, 90vw);
        z-index: 1;
        padding: 7px;
        border: 1px solid var(--palette-border);
        border-radius: var(--window-corner-radius);
        background: var(--palette-background);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        font: 13px system-ui, sans-serif;
        color: var(--palette-text);
        overflow: hidden;
        cursor: ns-resize;
      }
      #palette[hidden] {
        display: none;
      }
      /* The text starts where the results' text does. */
      #palette-input {
        box-sizing: border-box;
        width: 100%;
        padding: 13px calc(var(--result-inset) + var(--result-padding-x)) 14px;
        border: none;
        outline: none;
        background: none;
        font: inherit;
        font-size: 15px;
        color: inherit;
        cursor: text;
      }
      /* The line under the input, in the colour of the Pane dividers, is as wide as the results, and shows only while
         there are results under it. Without it the input keeps its spacing. */
      #palette:has(#palette-results:not(:empty)) #palette-input,
      #palette:has(#palette-import:not([hidden])) #palette-input {
        background: linear-gradient(var(--strong-divider), var(--strong-divider)) center bottom /
          calc(100% - 2 * var(--result-inset)) 1px no-repeat;
      }
      /* The last result ends as far above the dialog's bottom edge as the search text starts below its top edge. The
         script sets how tall it can grow. */
      #palette-results {
        margin: 0;
        padding: 7px 0 13px;
        list-style: none;
        overflow-y: auto;
        cursor: default;
      }
      #palette-results:empty {
        display: none;
      }
      .result {
        display: flex;
        gap: 10px;
        align-items: baseline;
        margin: 0 var(--result-inset);
        padding: 7px var(--result-padding-x);
        white-space: nowrap;
        cursor: default;
      }
      .result.selected {
        border-radius: 14px;
        background: var(--palette-selection);
      }
      /* Where the user already is, which can be selected but not chosen. */
      .result.current {
        color: var(--palette-muted-text);
      }
      /* A Hidden Tab and its Panes, here and in the Activity Sidebar. */
      .result.hidden-tab,
      .activity-row.hidden-tab {
        font-style: italic;
      }
      /* The nested view: space between the rows at the top, and each Session's Tabs and Panes under it, smaller and
         tighter, as is the Session's own row above them. */
      .result.top-level:not(:first-child) {
        margin-top: 4px;
      }
      .result.parent,
      .result.level-1,
      .result.level-2 {
        padding-top: 3px;
        padding-bottom: 3px;
      }
      .result.level-1,
      .result.level-2 {
        font-size: 11px;
        line-height: 10px;
      }
      .result.level-1 {
        padding-left: 18px;
      }
      .result.level-2 {
        padding-left: 22px;
      }
      .result .detail {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--palette-muted-text);
      }
      .result .kind {
        font-size: 11px;
        color: var(--palette-muted-text);
      }
      /* Before a Session's, Tab's or Pane's name, muted like its kind. */
      .result .kind-marker {
        margin-right: 5px;
        color: var(--palette-muted-text);
      }
      /* An Import's Theme file, to be saved, or why the Import was refused, under the input, its text where the input's
         starts. */
      #palette-import {
        display: grid;
        gap: 10px;
        padding: 12px calc(var(--result-inset) + var(--result-padding-x)) 13px;
        cursor: default;
      }
      #palette-import[hidden] {
        display: none;
      }
      /* The Theme in its own colours: its focused Tab, another Tab, and a prompt. */
      .import-sample {
        display: grid;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 12px;
      }
      .import-tab {
        display: inline-block;
        margin-right: 6px;
        padding: 0 8px;
        border-radius: 4px;
        font: 11px system-ui, sans-serif;
      }
      .import-swatches {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 3px;
      }
      .import-swatches span {
        height: 14px;
        border-radius: 3px;
      }
      .import-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 11px;
        color: var(--palette-muted-text);
      }
      .import-chips span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .import-chips i {
        width: 12px;
        height: 12px;
        border: 1px solid var(--palette-border);
        border-radius: 3px;
      }
      .import-detail,
      .import-keys {
        color: var(--palette-muted-text);
      }
      .import-keys {
        display: flex;
        gap: 16px;
        font-size: 12px;
      }
      .import-key:hover {
        color: var(--palette-text);
      }
      .import-keys kbd {
        margin-right: 5px;
        padding: 0 4px;
        border: 1px solid var(--palette-border);
        border-radius: 4px;
        font: 11px ui-monospace, monospace;
      }
      /* The Activity Sidebar slides over the side of the window the activitySidebar.side setting names, the full height
         of it, above the Tab bar and the Panes. It is as wide as the Command Palette and takes its colours. While it is
         open, the backdrop over the rest of the window takes clicks, which close it. */
      #activity-sidebar-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      #activity-sidebar-backdrop[hidden] {
        display: none;
      }
      #activity-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        z-index: 1;
        width: min(640px, 90vw);
        box-sizing: border-box;
        margin: 0;
        padding: 7px 0 13px;
        list-style: none;
        overflow-y: auto;
        border-left: 1px solid var(--palette-border);
        background: var(--palette-background);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        font: 13px system-ui, sans-serif;
        color: var(--palette-text);
        outline: none;
        cursor: default;
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 150ms ease-out,
          visibility 150ms;
      }
      body.activity-sidebar-left #activity-sidebar {
        right: auto;
        left: 0;
        border-left: none;
        border-right: 1px solid var(--palette-border);
        transform: translateX(-100%);
      }
      /* Visible at once as it opens, so it can take the keyboard while it slides in; as it closes, it stays visible until
         it has slid out. */
      #activity-sidebar.open {
        transform: none;
        visibility: visible;
        transition: transform 150ms ease-out;
      }
      /* Closed as the window lost focus, without sliding out. */
      #activity-sidebar.instant {
        transition: none;
      }
      /* With macOS's Reduce motion on, it appears and disappears without sliding. */
      @media (prefers-reduced-motion: reduce) {
        #activity-sidebar,
        #activity-sidebar.open {
          transition: none;
        }
      }
      /* A row is spaced like a Command Palette result, indented by its level. Headings, and the line saying there's no
         Activity, are muted; a Session's heading after the first has space above it. */
      .activity-row {
        margin: 0 var(--result-inset);
        padding: 7px var(--result-padding-x);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .activity-row.selected {
        border-radius: 14px;
        background: var(--palette-selection);
      }
      .activity-row.heading {
        color: var(--palette-muted-text);
      }
      .activity-row.level-0:not(:first-child) {
        margin-top: 6px;
      }
      .activity-row.level-1 {
        padding-left: calc(var(--result-padding-x) + 18px);
      }
      .activity-row.level-2 {
        padding-left: calc(var(--result-padding-x) + 36px);
      }
      /* The find bar takes the Command Palette's colours, and the Pane dividers' for the line before its count. */
      #find {
        position: fixed;
        top: 8px;
        right: 16px;
        z-index: 1;
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: min(320px, 60vw);
        box-sizing: border-box;
        padding: 7px 12px;
        border: 1px solid var(--palette-border);
        border-radius: 14px;
        background: var(--palette-background);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        font: 13px system-ui, sans-serif;
        color: var(--palette-text);
      }
      #find[hidden] {
        display: none;
      }
      #find-input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        font: inherit;
        color: inherit;
      }
      /* Shown while there is a count. */
      #find-separator {
        align-self: stretch;
        width: 1px;
        background: var(--strong-divider);
      }
      #find:has(#find-count:empty) #find-separator {
        display: none;
      }
      #find-count {
        font-size: 11px;
        white-space: nowrap;
        color: var(--palette-muted-text);
      }
    </style>
  </head>
  <body>
    <div id="panes"><div id="session-banner" hidden></div></div>
    <div id="tab-bar" hidden>
      <div id="tabs"></div>
      <div id="session-label"><span class="pill"></span></div>
    </div>
    <div id="palette" hidden>
      <input id="palette-input" type="text" spellcheck="false" autocomplete="off" />
      <div id="palette-import" hidden></div>
      <ul id="palette-results"></ul>
    </div>
    <div id="activity-sidebar-backdrop" hidden></div>
    <ul id="activity-sidebar" tabindex="-1"></ul>
    <div id="find" hidden>
      <input
        id="find-input"
        type="text"
        spellcheck="false"
        autocomplete="off"
        placeholder="Find: Enter for next, Shift+Enter for previous"
      />
      <span id="find-separator"></span>
      <span id="find-count"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
