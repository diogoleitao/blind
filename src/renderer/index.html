<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Blind</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* The Theme's terminal background, about 25% transparent, over the window's native blur. The colours are the
         Theme's, set by the script. */
      body {
        display: flex;
        flex-direction: column;
        background: var(--window-background);
      }
      /* The Command Palette on its own floats over the other apps with nothing behind it. */
      body.standalone {
        background: transparent;
      }
      #panes {
        position: relative;
        flex: 1;
      }
      .pane {
        position: absolute;
        box-sizing: border-box;
      }
      .pane.divided-left {
        border-left: 1px solid var(--divider);
      }
      .pane.divided-top {
        border-top: 1px solid var(--divider);
      }
      .pane.hidden {
        visibility: hidden;
      }
      .pane .terminal {
        height: 100%;
      }
      /* xterm's stylesheet paints the viewport opaque black, which would cover the body's background. */
      .pane .xterm .xterm-viewport {
        background-color: transparent;
      }
      #tab-bar {
        display: flex;
        border-top: 1px solid var(--divider);
        font: 12px system-ui, sans-serif;
        color: var(--tab-text);
      }
      #tab-bar[hidden] {
        display: none;
      }
      .tab {
        flex: 1;
        min-width: 0;
        padding: 5px 8px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab.focused {
        color: var(--focused-tab-text);
        background: var(--focused-tab-background);
      }
      #palette {
        position: fixed;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, 90vw);
        z-index: 1;
        border: 1px solid var(--palette-border);
        border-radius: 8px;
        background: var(--palette-background);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        font: 13px system-ui, sans-serif;
        color: var(--palette-text);
        overflow: hidden;
      }
      #palette[hidden] {
        display: none;
      }
      #palette-input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px 14px;
        border: none;
        border-bottom: 1px solid var(--palette-border);
        outline: none;
        background: transparent;
        font: inherit;
        font-size: 15px;
        color: inherit;
      }
      #palette-results {
        max-height: 50vh;
        margin: 0;
        padding: 4px 0;
        list-style: none;
        overflow-y: auto;
      }
      #palette-results:empty {
        display: none;
      }
      .result {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 14px;
        white-space: nowrap;
        cursor: default;
      }
      .result.selected {
        background: var(--palette-selection);
      }
      .result .detail {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--palette-muted-text);
      }
      .result .kind {
        font-size: 11px;
        color: var(--palette-muted-text);
      }
      /* The find bar takes the Command Palette's colours. */
      #find {
        position: fixed;
        top: 8px;
        right: 16px;
        z-index: 1;
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: min(320px, 60vw);
        padding: 6px 10px;
        border: 1px solid var(--palette-border);
        border-radius: 6px;
        background: var(--palette-background);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        font: 13px system-ui, sans-serif;
        color: var(--palette-text);
      }
      #find[hidden] {
        display: none;
      }
      #find-input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        font: inherit;
        color: inherit;
      }
      #find-count {
        font-size: 11px;
        white-space: nowrap;
        color: var(--palette-muted-text);
      }
    </style>
  </head>
  <body>
    <div id="panes"></div>
    <div id="tab-bar" hidden></div>
    <div id="palette" hidden>
      <input id="palette-input" type="text" spellcheck="false" autocomplete="off" />
      <ul id="palette-results"></ul>
    </div>
    <div id="find" hidden>
      <input
        id="find-input"
        type="text"
        spellcheck="false"
        autocomplete="off"
        placeholder="Find: Enter for next, Shift+Enter for previous"
      />
      <span id="find-count"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
