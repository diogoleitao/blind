<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Blind</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* About 25% transparent, over the window's native blur. */
      body {
        display: flex;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.75);
      }
      #panes {
        position: relative;
        flex: 1;
      }
      .pane {
        position: absolute;
        box-sizing: border-box;
      }
      .pane.divided-left {
        border-left: 1px solid rgba(255, 255, 255, 0.2);
      }
      .pane.divided-top {
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }
      .pane.hidden {
        visibility: hidden;
      }
      .pane .terminal {
        height: 100%;
      }
      /* xterm's stylesheet paints the viewport opaque black, which would cover the body's background. */
      .pane .xterm .xterm-viewport {
        background-color: transparent;
      }
      #tab-bar {
        display: flex;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font: 12px system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.55);
      }
      #tab-bar[hidden] {
        display: none;
      }
      .tab {
        flex: 1;
        min-width: 0;
        padding: 5px 8px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab.focused {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
      #palette {
        position: fixed;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, 90vw);
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        background: rgba(30, 30, 30, 0.97);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        font: 13px system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.85);
        overflow: hidden;
      }
      #palette[hidden] {
        display: none;
      }
      #palette-input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px 14px;
        border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        outline: none;
        background: transparent;
        font: inherit;
        font-size: 15px;
        color: #fff;
      }
      #palette-results {
        max-height: 50vh;
        margin: 0;
        padding: 4px 0;
        list-style: none;
        overflow-y: auto;
      }
      #palette-results:empty {
        display: none;
      }
      .result {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 14px;
        white-space: nowrap;
        cursor: default;
      }
      .result.selected {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
      }
      .result .detail {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: rgba(255, 255, 255, 0.45);
      }
      .result .kind {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="panes"></div>
    <div id="tab-bar" hidden></div>
    <div id="palette" hidden>
      <input id="palette-input" type="text" spellcheck="false" autocomplete="off" />
      <ul id="palette-results"></ul>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
